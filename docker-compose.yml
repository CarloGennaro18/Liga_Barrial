services:
  postgres:
    image: postgres:16-alpine
    container_name: liga-barrial-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: liga_user
      POSTGRES_PASSWORD: liga_password
      POSTGRES_DB: liga_barrial
    ports:
      - "5433:5432"          # ← 5433 en PC - 5432 del contenedor
    volumes:
      - liga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liga_user -d liga_barrial"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: liga-barrial-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  liga_pgdata: